version: 0.1

log:
  level: info
  formatter: text
  fields:
    service: registry

storage:
  filesystem:
    rootdirectory: /home/container/registry

auth:
  htpasswd:
    realm: Registry Realm
    path: /home/container/htpasswd

http:
  addr: 0.0.0.0:5000
  headers:
    X-Content-Type-Options: [nosniff]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
